<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Data Tanker - Master Tanker</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 25px 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #555;
            padding: 13px 15px;
            margin-bottom: 6px;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu a.active {
            background: #eef2ff;
            color: #3157d5;
            font-weight: bold;
        }

        /* CONTENT */

        .content {
            margin-left: 230px;
            padding: 35px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* SUMMARY */

        .summary-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .summary-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 20px;
        }

        .summary {
            color: #666;
            font-size: 14px;
        }

        .total {
            font-size: 32px;
            font-weight: bold;
            color: #3157d5;
            margin-top: 8px;
        }

        .total-aktif {
            color: #15803d;
        }

        .total-nonaktif {
            color: #dc2626;
        }

        /* FORM */

        .form-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input,
        select {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #3157d5;
        }

        /* BUTTON */

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-add {
            background: #3157d5;
            color: white;
        }

        .btn-add:hover {
            background: #2647b5;
        }

        .btn-edit {
            background: #f3f4f6;
            color: #333;
        }

        .btn-delete {
            background: #fee2e2;
            color: #dc2626;
        }

        /* SEARCH */

        .search-box {
            margin-top: 15px;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        /* TABLE */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .action {
            display: flex;
            gap: 7px;
        }

        /* STATUS */

        .status {
            display: inline-block;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-aktif {
            background: #dcfce7;
            color: #15803d;
        }

        .status-nonaktif {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-kosong {
            background: #f3f4f6;
            color: #666;
        }

        /* MESSAGE */

        .message {
            margin-top: 12px;
            font-size: 14px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            color: #3157d5;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .content {
                margin-left: 190px;
                padding: 20px;
            }

            .form-row {
                flex-direction: column;
            }

            .summary-container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            MASTER TANKER
        </div>

        <div class="menu">

            <a href="index.html">
                Dashboard
            </a>

            <a
                href="tanker.html"
                class="active"
            >
                Data Tanker
            </a>

            <a href="download.html">
                Download Report
            </a>

        </div>

    </div>



    <!-- CONTENT -->

    <div class="content">

        <h1>
            Data Tanker
        </h1>


        <!-- SUMMARY -->

        <div class="card">

            <div class="summary-container">

                <div class="summary-box">

                    <div class="summary">
                        Total Master Tanker
                    </div>

                    <div
                        class="total"
                        id="totalTanker"
                    >
                        0
                    </div>

                </div>


                <div class="summary-box">

                    <div class="summary">
                        Tanker Aktif
                    </div>

                    <div
                        class="total total-aktif"
                        id="totalAktif"
                    >
                        0
                    </div>

                </div>


                <div class="summary-box">

                    <div class="summary">
                        Tanker Non-Aktif
                    </div>

                    <div
                        class="total total-nonaktif"
                        id="totalNonAktif"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>



        <!-- TAMBAH MASTER TANKER -->

        <div class="card">

            <h3>
                Tambah Master Tanker
            </h3>

            <div class="form-row">

                <input
                    type="text"
                    id="inputTanker"
                    placeholder="Masukkan Tanker Number"
                >

                <select id="inputStatus">

                    <option value="AKTIF">
                        AKTIF
                    </option>

                    <option value="NON-AKTIF">
                        NON-AKTIF
                    </option>

                </select>

                <button
                    class="btn-add"
                    onclick="tambahTanker()"
                >
                    + Tambah
                </button>

            </div>

            <div
                id="message"
                class="message"
            ></div>

        </div>



        <!-- DAFTAR MASTER TANKER -->

        <div class="card">

            <h3>
                Daftar Master Tanker
            </h3>

            <input
                type="text"
                id="searchTanker"
                class="search-box"
                placeholder="🔎 Cari Tanker Number..."
                oninput="tampilkanData()"
            >

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th style="width:80px;">
                                No
                            </th>

                            <th>
                                Tanker Number
                            </th>

                            <th>
                                Status
                            </th>

                            <th style="width:180px;">
                                Aksi
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tankerTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>



<script>


/* =====================================================
   KONFIGURASI
===================================================== */

const namaFileMaster = "data tanker.xlsx";

const STORAGE_KEY = "dataTanker";


/* =====================================================
   DATA
===================================================== */

let dataTanker = [];


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    async function () {

        await bacaExcelMaster();

        tampilkanData();

    }
);


/* =====================================================
   BACA EXCEL
===================================================== */

async function bacaExcelMaster() {

    tampilkanPesan(
        "Sedang membaca data dari Excel...",
        "loading"
    );


    try {

        /* ---------------------------------------------
           AMBIL FILE EXCEL
        --------------------------------------------- */

        const response = await fetch(
            namaFileMaster + "?v=" + Date.now(),
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "File data tanker.xlsx tidak ditemukan."
            );

        }


        /* ---------------------------------------------
           BACA FILE
        --------------------------------------------- */

        const arrayBuffer =
            await response.arrayBuffer();


        /* ---------------------------------------------
           BUKA EXCEL
        --------------------------------------------- */

        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array"
                }
            );


        /* ---------------------------------------------
           AMBIL SHEET PERTAMA
        --------------------------------------------- */

        const worksheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        if (!worksheet) {

            throw new Error(
                "Sheet Excel tidak ditemukan."
            );

        }


        /* ---------------------------------------------
           BACA SEMUA BARIS SEBAGAI ARRAY
        --------------------------------------------- */

        const rows =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: "",
                    raw: false
                }
            );


        console.log(
            "Jumlah baris Excel:",
            rows.length
        );


        console.log(
            "Header Excel:",
            rows[0]
        );


        /* ---------------------------------------------
           DATA BARU
        --------------------------------------------- */

        const daftarTanker = [];


        /*
        ================================================
        STRUKTUR EXCEL

        KOLOM A = index 0
        KOLOM B = index 1
        ...
        KOLOM N = index 13

        YANG DIGUNAKAN:

        index 1  = Tanker Number
        index 13 = Status
        ================================================
        */


        /* ---------------------------------------------
           MULAI BARIS KE-2
           BARIS KE-1 ADALAH HEADER
        --------------------------------------------- */

        for (
            let i = 1;
            i < rows.length;
            i++
        ) {

            const row = rows[i];


            /*
            --------------------------------------------
            KOLOM B
            TANKER NUMBER

            B = index 1
            --------------------------------------------
            */

            const tanker =
                String(
                    row[1] ?? ""
                )
                .trim();


            /*
            --------------------------------------------
            KOLOM N
            STATUS

            N = index 13
            --------------------------------------------
            */

            const status =
                String(
                    row[13] ?? ""
                )
                .replace(/\u00A0/g, " ")
                .trim()
                .toUpperCase();


            /*
            --------------------------------------------
            HANYA BACA DATA YANG KOLOM B-NYA ADA ISI
            --------------------------------------------
            */

            if (tanker !== "") {

                daftarTanker.push({

                    /*
                    NOMOR DIBUAT SENDIRI
                    */

                    nomor:
                        daftarTanker.length + 1,

                    tanker:
                        tanker,

                    status:
                        status

                });

            }

        }


        /* ---------------------------------------------
           SIMPAN DATA
        --------------------------------------------- */

        dataTanker =
            daftarTanker;


        /*
        ---------------------------------------------
        URUTKAN TANKER NUMBER
        ---------------------------------------------

        Kalau ingin nomor 1,2,3 mengikuti urutan Excel,
        JANGAN mengurutkan data di sini.

        Jadi urutan Excel dipertahankan.
        */

        
        /* ---------------------------------------------
           SIMPAN LOCAL STORAGE
        --------------------------------------------- */

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(dataTanker)
        );


        /* ---------------------------------------------
           HITUNG
        --------------------------------------------- */

        const total =
            dataTanker.length;


        const aktif =
            dataTanker.filter(
                function (item) {

                    return item.status === "AKTIF";

                }
            ).length;


        const nonAktif =
            dataTanker.filter(
                function (item) {

                    return item.status === "NON-AKTIF";

                }
            ).length;


        /* ---------------------------------------------
           DEBUG
        --------------------------------------------- */

        console.log(
            "================================"
        );

        console.log(
            "TOTAL MASTER TANKER:",
            total
        );

        console.log(
            "TOTAL AKTIF:",
            aktif
        );

        console.log(
            "TOTAL NON-AKTIF:",
            nonAktif
        );

        console.log(
            "================================"
        );


        /*
        ---------------------------------------------
        TAMPILKAN STATUS YANG TERBACA
        ---------------------------------------------
        */

        const statusUnik =
            [
                ...new Set(
                    dataTanker.map(
                        function (item) {
                            return item.status;
                        }
                    )
                )
            ];


        console.log(
            "STATUS KOLOM N YANG TERBACA:",
            statusUnik
        );


        /*
        ---------------------------------------------
        TAMPILKAN DATA
        ---------------------------------------------
        */

        tampilkanData();


        tampilkanPesan(
            "Data Excel berhasil dibaca. Total Master Tanker: " +
            total,
            "success"
        );

    }


    catch (error) {

        console.error(
            "Gagal membaca Excel:",
            error
        );


        /*
        ---------------------------------------------
        KALAU EXCEL GAGAL
        PAKAI DATA TERAKHIR
        ---------------------------------------------
        */

        const dataLama =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (dataLama) {

            try {

                dataTanker =
                    JSON.parse(
                        dataLama
                    );

            }
            catch {

                dataTanker = [];

            }

        }
        else {

            dataTanker = [];

        }


        tampilkanData();


        tampilkanPesan(
            "Excel gagal dibaca: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData() {

    const table =
        document.getElementById(
            "tankerTable"
        );


    const totalElement =
        document.getElementById(
            "totalTanker"
        );


    const aktifElement =
        document.getElementById(
            "totalAktif"
        );


    const nonAktifElement =
        document.getElementById(
            "totalNonAktif"
        );


    const search =
        document.getElementById(
            "searchTanker"
        );


    /* ---------------------------------------------
       HITUNG TOTAL
    --------------------------------------------- */

    const total =
        dataTanker.length;


    const aktif =
        dataTanker.filter(
            function (item) {

                return item.status === "AKTIF";

            }
        ).length;


    const nonAktif =
        dataTanker.filter(
            function (item) {

                return item.status === "NON-AKTIF";

            }
        ).length;


    /* ---------------------------------------------
       TAMPILKAN TOTAL
    --------------------------------------------- */

    totalElement.textContent =
        total;


    aktifElement.textContent =
        aktif;


    nonAktifElement.textContent =
        nonAktif;


    /* ---------------------------------------------
       SEARCH
    --------------------------------------------- */

    const keyword =
        search
            ? search.value
                .trim()
                .toLowerCase()
            : "";


    const dataTampil =
        dataTanker.filter(
            function (item) {

                return item.tanker
                    .toLowerCase()
                    .includes(keyword);

            }
        );


    /* ---------------------------------------------
       KOSONGKAN TABLE
    --------------------------------------------- */

    table.innerHTML = "";


    /* ---------------------------------------------
       TIDAK ADA DATA
    --------------------------------------------- */

    if (
        dataTampil.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty"
                >
                    Tidak ada tanker yang ditemukan.
                </td>

            </tr>

        `;

        return;

    }


    /* ---------------------------------------------
       TAMPILKAN DATA
    --------------------------------------------- */

    dataTampil.forEach(
        function (item) {

            const index =
                dataTanker.indexOf(item);


            const row =
                document.createElement("tr");


            /*
            STATUS CLASS
            */

            let statusClass =
                "status-kosong";


            if (
                item.status === "AKTIF"
            ) {

                statusClass =
                    "status-aktif";

            }


            else if (
                item.status === "NON-AKTIF"
            ) {

                statusClass =
                    "status-nonaktif";

            }


            /*
            NOMOR DIBUAT SENDIRI
            */

            row.innerHTML = `

                <td>
                    ${item.nomor}
                </td>

                <td>
                    ${item.tanker}
                </td>

                <td>

                    <span
                        class="status ${statusClass}"
                    >
                        ${item.status || "-"}
                    </span>

                </td>

                <td>

                    <div class="action">

                        <button
                            class="btn-edit"
                            onclick="editTanker(${index})"
                        >
                            Edit
                        </button>

                        <button
                            class="btn-delete"
                            onclick="hapusTanker(${index})"
                        >
                            Hapus
                        </button>

                    </div>

                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* =====================================================
   TAMBAH TANKER
===================================================== */

function tambahTanker() {

    const input =
        document.getElementById(
            "inputTanker"
        );


    const statusInput =
        document.getElementById(
            "inputStatus"
        );


    const tanker =
        input.value.trim();


    const status =
        statusInput.value;


    if (
        tanker === ""
    ) {

        tampilkanPesan(
            "Nomor tanker belum diisi.",
            "error"
        );

        return;

    }


    /* ---------------------------------------------
       CEK DUPLIKAT
    --------------------------------------------- */

    const sudahAda =
        dataTanker.some(
            function (item) {

                return (
                    item.tanker.toLowerCase() ===
                    tanker.toLowerCase()
                );

            }
        );


    if (sudahAda) {

        tampilkanPesan(
            "Nomor tanker tersebut sudah ada.",
            "error"
        );

        return;

    }


    /* ---------------------------------------------
       NOMOR OTOMATIS
    --------------------------------------------- */

    dataTanker.push({

        nomor:
            dataTanker.length + 1,

        tanker:
            tanker,

        status:
            status

    });


    /* ---------------------------------------------
       SIMPAN
    --------------------------------------------- */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(dataTanker)
    );


    input.value = "";


    tampilkanData();


    tampilkanPesan(
        "Master tanker berhasil ditambahkan.",
        "success"
    );

}


/* =====================================================
   EDIT TANKER
===================================================== */

function editTanker(index) {

    const item =
        dataTanker[index];


    const tankerBaru =
        prompt(
            "Edit Tanker Number:",
            item.tanker
        );


    if (
        tankerBaru === null
    ) {

        return;

    }


    const tanker =
        tankerBaru.trim();


    if (
        tanker === ""
    ) {

        alert(
            "Tanker Number tidak boleh kosong."
        );

        return;

    }


    /* ---------------------------------------------
       CEK DUPLIKAT
    --------------------------------------------- */

    const duplikat =
        dataTanker.some(
            function (data, i) {

                return (
                    i !== index &&
                    data.tanker.toLowerCase() ===
                    tanker.toLowerCase()
                );

            }
        );


    if (duplikat) {

        alert(
            "Tanker Number tersebut sudah ada."
        );

        return;

    }


    /* ---------------------------------------------
       EDIT STATUS
    --------------------------------------------- */

    const statusBaru =
        prompt(
            "Edit Status:\n\nKetik AKTIF atau NON-AKTIF",
            item.status
        );


    if (
        statusBaru === null
    ) {

        return;

    }


    const status =
        statusBaru
            .trim()
            .toUpperCase();


    if (
        status !== "AKTIF" &&
        status !== "NON-AKTIF"
    ) {

        alert(
            "Status harus AKTIF atau NON-AKTIF."
        );

        return;

    }


    /* ---------------------------------------------
       UPDATE
    --------------------------------------------- */

    dataTanker[index].tanker =
        tanker;


    dataTanker[index].status =
        status;


    /* ---------------------------------------------
       SIMPAN
    --------------------------------------------- */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(dataTanker)
    );


    tampilkanData();


    tampilkanPesan(
        "Data tanker berhasil diedit.",
        "success"
    );

}


/* =====================================================
   HAPUS TANKER
===================================================== */

function hapusTanker(index) {

    const item =
        dataTanker[index];


    const yakin =
        confirm(
            "Yakin ingin menghapus tanker " +
            item.tanker +
            "?"
        );


    if (!yakin) {

        return;

    }


    dataTanker.splice(
        index,
        1
    );


    /*
    SET ULANG NOMOR
    AGAR SELALU 1, 2, 3, 4, ...
    */

    dataTanker.forEach(
        function (item, i) {

            item.nomor =
                i + 1;

        }
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(dataTanker)
    );


    tampilkanData();


    tampilkanPesan(
        "Master tanker berhasil dihapus.",
        "success"
    );

}


/* =====================================================
   PESAN
===================================================== */

function tampilkanPesan(
    pesan,
    tipe
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        pesan;


    message.className =
        "message " +
        tipe;

}

</script>

</body>

</html>

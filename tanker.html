<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Data Tanker - Master Tanker</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            background: white;

            border-right: 1px solid #e5e7eb;

            padding: 25px 15px;

        }


        .logo {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 35px;

            padding-left: 10px;

        }


        .menu a {

            display: block;

            text-decoration: none;

            color: #555;

            padding: 13px 15px;

            margin-bottom: 6px;

            border-radius: 8px;

        }


        .menu a:hover,
        .menu a.active {

            background: #eef2ff;

            color: #3157d5;

            font-weight: bold;

        }


        /* =========================================
           CONTENT
        ========================================= */

        .content {

            margin-left: 230px;

            padding: 35px;

        }


        h1 {

            margin-top: 0;

            margin-bottom: 25px;

        }


        /* =========================================
           CARD
        ========================================= */

        .card {

            background: white;

            border-radius: 12px;

            padding: 22px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);

        }


        /* =========================================
           SUMMARY
        ========================================= */

        .summary-container {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

        }


        .summary-box {

            background: #f8fafc;

            border-radius: 10px;

            padding: 20px;

        }


        .summary {

            color: #666;

            font-size: 14px;

        }


        .total {

            font-size: 32px;

            font-weight: bold;

            color: #3157d5;

            margin-top: 8px;

        }


        .total-aktif {

            color: #15803d;

        }


        .total-nonaktif {

            color: #dc2626;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-row {

            display: flex;

            gap: 10px;

            margin-top: 15px;

        }


        input,
        select {

            flex: 1;

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;

        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #3157d5;

        }


        /* =========================================
           BUTTON
        ========================================= */

        button {

            border: none;

            border-radius: 7px;

            padding: 11px 18px;

            cursor: pointer;

            font-size: 14px;

        }


        .btn-add {

            background: #3157d5;

            color: white;

        }


        .btn-add:hover {

            background: #2647b5;

        }


        .btn-edit {

            background: #f3f4f6;

            color: #333;

        }


        .btn-edit:hover {

            background: #e5e7eb;

        }


        .btn-delete {

            background: #fee2e2;

            color: #dc2626;

        }


        .btn-delete:hover {

            background: #fecaca;

        }


        /* =========================================
           SEARCH
        ========================================= */

        .search-box {

            margin-top: 15px;

            width: 100%;

            padding: 12px 14px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;

        }


        /* =========================================
           TABLE
        ========================================= */

        .table-container {

            width: 100%;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;

        }


        th,
        td {

            padding: 13px;

            border-bottom:
                1px solid #eee;

            text-align: left;

        }


        th {

            background: #f8fafc;

        }


        .action {

            display: flex;

            gap: 7px;

        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            display: inline-block;

            padding: 5px 11px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }


        .status-aktif {

            background: #dcfce7;

            color: #15803d;

        }


        .status-nonaktif {

            background: #fee2e2;

            color: #dc2626;

        }


        .status-kosong {

            background: #f3f4f6;

            color: #666;

        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            margin-top: 12px;

            font-size: 14px;

        }


        .success {

            color: #15803d;

        }


        .error {

            color: #dc2626;

        }


        .loading {

            color: #3157d5;

        }


        /* =========================================
           EMPTY
        ========================================= */

        .empty {

            text-align: center;

            padding: 30px;

            color: #888;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 800px) {

            .sidebar {

                width: 190px;

            }


            .content {

                margin-left: 190px;

                padding: 20px;

            }


            .form-row {

                flex-direction: column;

            }


            .summary-container {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <div class="sidebar">

        <div class="logo">
            MASTER TANKER
        </div>


        <div class="menu">

            <a href="index.html">
                Dashboard
            </a>


            <a
                href="tanker.html"
                class="active"
            >
                Data Tanker
            </a>


            <a href="download.html">
                Download Report
            </a>

        </div>

    </div>



    <!-- =========================================
         CONTENT
    ========================================== -->

    <div class="content">


        <h1>
            Data Tanker
        </h1>



        <!-- =====================================
             SUMMARY
        ====================================== -->

        <div class="card">

            <div class="summary-container">


                <!-- TOTAL MASTER TANKER -->

                <div class="summary-box">

                    <div class="summary">
                        Total Master Tanker
                    </div>


                    <div
                        class="total"
                        id="totalTanker"
                    >
                        0
                    </div>

                </div>



                <!-- TOTAL AKTIF -->

                <div class="summary-box">

                    <div class="summary">
                        Tanker Aktif
                    </div>


                    <div
                        class="total total-aktif"
                        id="totalAktif"
                    >
                        0
                    </div>

                </div>



                <!-- TOTAL NON AKTIF -->

                <div class="summary-box">

                    <div class="summary">
                        Tanker Non-Aktif
                    </div>


                    <div
                        class="total total-nonaktif"
                        id="totalNonAktif"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>



        <!-- =====================================
             TAMBAH MASTER TANKER
        ====================================== -->

        <div class="card">

            <h3>
                Tambah Master Tanker
            </h3>


            <div class="form-row">


                <input
                    type="text"
                    id="inputNomor"
                    placeholder="Nomor"
                >


                <input
                    type="text"
                    id="inputTanker"
                    placeholder="Masukkan Tanker Number"
                >


                <select id="inputStatus">

                    <option value="AKTIF">
                        AKTIF
                    </option>

                    <option value="NON-AKTIF">
                        NON-AKTIF
                    </option>

                </select>


                <button
                    class="btn-add"
                    onclick="tambahTanker()"
                >
                    + Tambah
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>

        </div>



        <!-- =====================================
             DAFTAR MASTER TANKER
        ====================================== -->

        <div class="card">

            <h3>
                Daftar Master Tanker
            </h3>


            <input
                type="text"
                id="searchTanker"
                class="search-box"
                placeholder="🔎 Cari Tanker Number..."
                oninput="tampilkanData()"
            >


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th style="width:80px;">
                                No
                            </th>


                            <th>
                                Tanker Number
                            </th>


                            <th>
                                Status
                            </th>


                            <th style="width:180px;">
                                Aksi
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tankerTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>



<script>


/* =====================================================
   KONFIGURASI
===================================================== */

const namaFileMaster =
    "data tanker.xlsx";


const STORAGE_KEY =
    "dataTanker";



/* =====================================================
   DATA
===================================================== */

let dataTanker = [];



/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    async function () {

        await bacaExcelMaster();

        tampilkanData();

    }
);



/* =====================================================
   BACA EXCEL MASTER
===================================================== */

async function bacaExcelMaster() {

    tampilkanPesan(
        "Sedang membaca data dari Excel...",
        "loading"
    );


    try {


        /* =============================================
           AMBIL FILE EXCEL
        ============================================= */

        const response =
            await fetch(
                namaFileMaster +
                "?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "File data tanker.xlsx tidak ditemukan."
            );

        }


        /* =============================================
           BACA FILE
        ============================================= */

        const arrayBuffer =
            await response.arrayBuffer();


        /* =============================================
           BUKA EXCEL
        ============================================= */

        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array"
                }
            );


        /* =============================================
           PILIH SHEET
        ============================================= */

        let worksheet =
            workbook.Sheets["data"];


        if (!worksheet) {

            worksheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];

        }


        if (!worksheet) {

            throw new Error(
                "Sheet Excel tidak ditemukan."
            );

        }


        /* =============================================
           BACA EXCEL SEBAGAI ARRAY
        ============================================= */

        const rows =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: ""
                }
            );


        console.log(
            "Jumlah seluruh baris Excel:",
            rows.length
        );


        console.log(
            "Header Excel:",
            rows[0]
        );


        /* =============================================
           ARRAY DATA MASTER
        ============================================= */

        const daftarTanker = [];


        /*

        STRUKTUR EXCEL:

        A = index 0 = Nomor
        B = index 1 = Tanker Number
        C = index 2
        D = index 3
        E = index 4
        F = index 5
        G = index 6
        H = index 7
        I = index 8
        J = index 9
        K = index 10
        L = index 11
        M = index 12 = Type
        N = index 13 = Status


        JADI:

        Total Master Tanker
        = jumlah isi kolom B


        Status
        = kolom N

        */


        for (
            let i = 1;
            i < rows.length;
            i++
        ) {


            const row =
                rows[i];


            /* =========================================
               KOLOM A
               NOMOR
            ========================================= */

            const nomor =
                String(
                    row[0] ?? ""
                ).trim();


            /* =========================================
               KOLOM B
               TANKER NUMBER
               
               INI YANG MENENTUKAN
               TOTAL MASTER TANKER
            ========================================= */

            const tanker =
                String(
                    row[1] ?? ""
                ).trim();


            /* =========================================
               KOLOM N
               STATUS
            ========================================= */

            const status =
                String(
                    row[13] ?? ""
                )
                .trim()
                .toUpperCase();


            /* =========================================
               HANYA DATA DENGAN TANKER NUMBER
               
               Kalau kolom B kosong,
               TIDAK dihitung sebagai master tanker.
            ========================================= */

            if (
                tanker !== ""
            ) {

                daftarTanker.push({

                    nomor:
                        nomor,

                    tanker:
                        tanker,

                    status:
                        status

                });

            }

        }


        /* =============================================
           SIMPAN DATA
        ============================================= */

        dataTanker =
            daftarTanker;


        /* =============================================
           URUTKAN TANKER NUMBER
        ============================================= */

        dataTanker.sort(
            function (a, b) {

                return a.tanker.localeCompare(
                    b.tanker,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                );

            }
        );


        /* =============================================
           SIMPAN KE LOCAL STORAGE
        ============================================= */

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                dataTanker
            )
        );


        /* =============================================
           HITUNG JUMLAH
        ============================================= */

        const jumlahTotal =
            dataTanker.length;


        const jumlahAktif =
            dataTanker.filter(
                function (item) {

                    return (
                        item.status ===
                        "AKTIF"
                    );

                }
            ).length;


        const jumlahNonAktif =
            dataTanker.filter(
                function (item) {

                    return (
                        item.status ===
                        "NON-AKTIF"
                    );

                }
            ).length;


        /* =============================================
           DEBUG
        ============================================= */

        console.log(
            "=============================="
        );


        console.log(
            "TOTAL MASTER TANKER:",
            jumlahTotal
        );


        console.log(
            "TOTAL AKTIF:",
            jumlahAktif
        );


        console.log(
            "TOTAL NON-AKTIF:",
            jumlahNonAktif
        );


        console.log(
            "=============================="
        );


        /* =============================================
           CEK STATUS UNIK
        ============================================= */

        const statusUnik =
            [
                ...new Set(
                    dataTanker.map(
                        function (item) {

                            return item.status;

                        }
                    )
                )
            ];


        console.log(
            "STATUS YANG TERBACA:",
            statusUnik
        );


        /* =============================================
           TAMPILKAN
        ============================================= */

        tampilkanData();


        tampilkanPesan(
            "Data Master Tanker berhasil diperbarui dari Excel. Total: " +
            jumlahTotal +
            " tanker.",
            "success"
        );

    }


    catch (error) {


        console.error(
            "ERROR BACA EXCEL:",
            error
        );


        /* =============================================
           JIKA EXCEL GAGAL
        ============================================= */

        const dataLama =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (
            dataLama
        ) {

            try {

                dataTanker =
                    JSON.parse(
                        dataLama
                    );

            }

            catch (
                error
            ) {

                dataTanker = [];

            }

        }

        else {

            dataTanker = [];

        }


        tampilkanData();


        tampilkanPesan(
            "Excel gagal dibaca: " +
            error.message,
            "error"
        );

    }

}



/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData() {


    /* =============================================
       ELEMENT HTML
    ============================================= */

    const table =
        document.getElementById(
            "tankerTable"
        );


    const total =
        document.getElementById(
            "totalTanker"
        );


    const totalAktif =
        document.getElementById(
            "totalAktif"
        );


    const totalNonAktif =
        document.getElementById(
            "totalNonAktif"
        );


    const search =
        document.getElementById(
            "searchTanker"
        );


    /* =============================================
       SEARCH
    ============================================= */

    const kataCari =
        search
            ? search.value
                .trim()
                .toLowerCase()
            : "";


    /* =============================================
       TOTAL MASTER TANKER
       
       BERDASARKAN JUMLAH DATA
       YANG MEMILIKI TANKER NUMBER
       DI KOLOM B.
    ============================================= */

    const jumlahTotal =
        dataTanker.length;


    /* =============================================
       TOTAL AKTIF
       
       STATUS HARUS "AKTIF"
    ============================================= */

    const jumlahAktif =
        dataTanker.filter(
            function (item) {

                return (
                    item.status ===
                    "AKTIF"
                );

            }
        ).length;


    /* =============================================
       TOTAL NON-AKTIF
       
       STATUS HARUS "NON-AKTIF"
    ============================================= */

    const jumlahNonAktif =
        dataTanker.filter(
            function (item) {

                return (
                    item.status ===
                    "NON-AKTIF"
                );

            }
        ).length;


    /* =============================================
       TAMPILKAN SUMMARY
    ============================================= */

    total.textContent =
        jumlahTotal;


    totalAktif.textContent =
        jumlahAktif;


    totalNonAktif.textContent =
        jumlahNonAktif;


    /* =============================================
       FILTER SEARCH
    ============================================= */

    const dataTampil =
        dataTanker.filter(
            function (item) {

                return item.tanker
                    .toLowerCase()
                    .includes(
                        kataCari
                    );

            }
        );


    /* =============================================
       KOSONGKAN TABLE
    ============================================= */

    table.innerHTML = "";


    /* =============================================
       JIKA TIDAK ADA DATA
    ============================================= */

    if (
        dataTampil.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty"
                >

                    Tidak ada tanker
                    yang ditemukan.

                </td>

            </tr>

        `;

        return;

    }


    /* =============================================
       TAMPILKAN SETIAP DATA
    ============================================= */

    dataTampil.forEach(
        function (item) {


            const index =
                dataTanker.indexOf(
                    item
                );


            const row =
                document.createElement(
                    "tr"
                );


            /* =====================================
               STATUS CLASS
            ===================================== */

            let statusClass =
                "status-kosong";


            if (
                item.status ===
                "AKTIF"
            ) {

                statusClass =
                    "status-aktif";

            }


            else if (
                item.status ===
                "NON-AKTIF"
            ) {

                statusClass =
                    "status-nonaktif";

            }


            /* =====================================
               BUAT ROW
            ===================================== */

            row.innerHTML = `

                <td>
                    ${item.nomor}
                </td>


                <td>
                    ${item.tanker}
                </td>


                <td>

                    <span
                        class="status ${statusClass}"
                    >

                        ${item.status || "-"}

                    </span>

                </td>


                <td>

                    <div class="action">


                        <button
                            class="btn-edit"
                            onclick="editTanker(${index})"
                        >
                            Edit
                        </button>


                        <button
                            class="btn-delete"
                            onclick="hapusTanker(${index})"
                        >
                            Hapus
                        </button>


                    </div>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}



/* =====================================================
   TAMBAH TANKER
===================================================== */

function tambahTanker() {


    const inputNomor =
        document.getElementById(
            "inputNomor"
        );


    const inputTanker =
        document.getElementById(
            "inputTanker"
        );


    const inputStatus =
        document.getElementById(
            "inputStatus"
        );


    const nomor =
        inputNomor.value.trim();


    const tanker =
        inputTanker.value.trim();


    const status =
        inputStatus.value;


    /* =============================================
       CEK TANKER NUMBER
    ============================================= */

    if (
        tanker === ""
    ) {

        tampilkanPesan(
            "Nomor tanker belum diisi.",
            "error"
        );

        return;

    }


    /* =============================================
       CEK DUPLIKAT
    ============================================= */

    const sudahAda =
        dataTanker.some(
            function (item) {

                return (
                    item.tanker
                        .toLowerCase() ===
                    tanker.toLowerCase()
                );

            }
        );


    if (
        sudahAda
    ) {

        tampilkanPesan(
            "Nomor tanker tersebut sudah ada.",
            "error"
        );

        return;

    }


    /* =============================================
       TAMBAHKAN
    ============================================= */

    dataTanker.push({

        nomor:
            nomor ||
            String(
                dataTanker.length + 1
            ),

        tanker:
            tanker,

        status:
            status

    });


    /* =============================================
       URUTKAN
    ============================================= */

    dataTanker.sort(
        function (a, b) {

            return a.tanker.localeCompare(
                b.tanker,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            );

        }
    );


    /* =============================================
       SIMPAN
    ============================================= */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            dataTanker
        )
    );


    /* =============================================
       RESET INPUT
    ============================================= */

    inputNomor.value = "";

    inputTanker.value = "";


    /* =============================================
       UPDATE
    ============================================= */

    tampilkanData();


    tampilkanPesan(
        "Master tanker berhasil ditambahkan.",
        "success"
    );

}



/* =====================================================
   EDIT TANKER
===================================================== */

function editTanker(
    index
) {


    const item =
        dataTanker[index];


    /* =============================================
       EDIT TANKER NUMBER
    ============================================= */

    const tankerBaru =
        prompt(
            "Edit Tanker Number:",
            item.tanker
        );


    if (
        tankerBaru === null
    ) {

        return;

    }


    const tanker =
        tankerBaru.trim();


    if (
        tanker === ""
    ) {

        alert(
            "Tanker Number tidak boleh kosong."
        );

        return;

    }


    /* =============================================
       CEK DUPLIKAT
    ============================================= */

    const duplikat =
        dataTanker.some(
            function (
                data,
                i
            ) {

                return (

                    i !== index &&

                    data.tanker
                        .toLowerCase() ===
                    tanker.toLowerCase()

                );

            }
        );


    if (
        duplikat
    ) {

        alert(
            "Nomor tanker tersebut sudah ada."
        );

        return;

    }


    /* =============================================
       EDIT STATUS
    ============================================= */

    const statusBaru =
        prompt(
            "Edit Status:\n\n" +
            "Ketik AKTIF atau NON-AKTIF",
            item.status
        );


    if (
        statusBaru === null
    ) {

        return;

    }


    const status =
        statusBaru
            .trim()
            .toUpperCase();


    /* =============================================
       VALIDASI STATUS
    ============================================= */

    if (
        status !== "AKTIF" &&
        status !== "NON-AKTIF"
    ) {

        alert(
            "Status harus AKTIF atau NON-AKTIF."
        );

        return;

    }


    /* =============================================
       UPDATE DATA
    ============================================= */

    dataTanker[index].tanker =
        tanker;


    dataTanker[index].status =
        status;


    /* =============================================
       SIMPAN
    ============================================= */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            dataTanker
        )
    );


    /* =============================================
       UPDATE TAMPILAN
    ============================================= */

    tampilkanData();


    tampilkanPesan(
        "Data tanker berhasil diedit.",
        "success"
    );

}



/* =====================================================
   HAPUS TANKER
===================================================== */

function hapusTanker(
    index
) {


    const item =
        dataTanker[index];


    const yakin =
        confirm(
            "Yakin ingin menghapus tanker " +
            item.tanker +
            "?"
        );


    if (
        !yakin
    ) {

        return;

    }


    /* =============================================
       HAPUS
    ============================================= */

    dataTanker.splice(
        index,
        1
    );


    /* =============================================
       SIMPAN
    ============================================= */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            dataTanker
        )
    );


    /* =============================================
       UPDATE
    ============================================= */

    tampilkanData();


    tampilkanPesan(
        "Master tanker berhasil dihapus.",
        "success"
    );

}



/* =====================================================
   TAMPILKAN PESAN
===================================================== */

function tampilkanPesan(
    pesan,
    tipe
) {


    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        pesan;


    message.className =
        "message " +
        tipe;

}

</script>

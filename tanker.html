<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Tanker - Master Tanker</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 25px 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #555;
            padding: 13px 15px;
            margin-bottom: 6px;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu a.active {
            background: #eef2ff;
            color: #3157d5;
            font-weight: bold;
        }

        .content {
            margin-left: 230px;
            padding: 35px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .summary {
            color: #666;
            font-size: 15px;
        }

        .total {
            font-size: 32px;
            font-weight: bold;
            color: #3157d5;
            margin-top: 8px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #3157d5;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-add {
            background: #3157d5;
            color: white;
        }

        .btn-add:hover {
            background: #2647b5;
        }

        .btn-edit {
            background: #f3f4f6;
            color: #333;
        }

        .btn-delete {
            background: #fee2e2;
            color: #dc2626;
        }

        .search-box {
            margin-top: 15px;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .action {
            display: flex;
            gap: 7px;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            color: #3157d5;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .content {
                margin-left: 190px;
                padding: 20px;
            }

            .form-row {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        MASTER TANKER
    </div>

    <div class="menu">

        <a href="index.html">
            Dashboard
        </a>

        <a href="tanker.html" class="active">
            Data Tanker
        </a>

        <a href="download.html">
            Download Report
        </a>

    </div>

</div>



<!-- CONTENT -->

<div class="content">

    <h1>
        Data Tanker
    </h1>



    <!-- TOTAL -->

    <div class="card">

        <div class="summary">
            Total Master Tanker
        </div>

        <div
            class="total"
            id="totalTanker"
        >
            0
        </div>

    </div>



    <!-- TAMBAH TANKER -->

    <div class="card">

        <h3>
            Tambah Master Tanker
        </h3>

        <div class="form-row">

            <input
                type="text"
                id="inputTanker"
                placeholder="Masukkan nomor tanker"
            >

            <button
                class="btn-add"
                onclick="tambahTanker()"
            >
                + Tambah
            </button>

        </div>

        <div
            id="message"
            class="message"
        ></div>

    </div>



    <!-- DAFTAR TANKER -->

    <div class="card">

        <h3>
            Daftar Master Tanker
        </h3>

        <input
            type="text"
            id="searchTanker"
            class="search-box"
            placeholder="🔎 Cari Tanker Number..."
            oninput="tampilkanData()"
        >


        <table>

            <thead>

                <tr>

                    <th style="width:80px;">
                        No
                    </th>

                    <th>
                        Tanker Number
                    </th>

                    <th style="width:180px;">
                        Aksi
                    </th>

                </tr>

            </thead>

            <tbody id="tankerTable">

            </tbody>

        </table>

    </div>

</div>



<script>


/* =====================================================
   KONFIGURASI
===================================================== */

const namaFileMaster =
    "data tanker.xlsx";

const STORAGE_KEY =
    "dataTanker";



/* =====================================================
   DATA AWAL
===================================================== */

let dataTanker =
    JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        ) || "[]"
    );



/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    async function() {

        /*
        Baca Excel TERBARU dulu.
        */

        await bacaExcelMaster();

        /*
        Setelah selesai,
        tampilkan data.
        */

        tampilkanData();

    }
);



/* =====================================================
   BACA EXCEL MASTER TERBARU
===================================================== */

async function bacaExcelMaster() {

    tampilkanPesan(
        "Sedang membaca data dari Excel...",
        "loading"
    );


    try {

        /*
        Tambahkan timestamp supaya
        browser tidak menggunakan cache lama.
        */

        const response =
            await fetch(
                namaFileMaster +
                "?v=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "File data tanker.xlsx tidak ditemukan."
            );

        }


        const arrayBuffer =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array"
                }
            );


        /*
        Cari sheet "data".
        */

        let worksheet =
            workbook.Sheets["data"];


        /*
        Kalau sheet "data" tidak ada,
        gunakan sheet pertama.
        */

        if (!worksheet) {

            const namaSheet =
                workbook.SheetNames[0];

            worksheet =
                workbook.Sheets[namaSheet];

        }


        if (!worksheet) {

            throw new Error(
                "Sheet Excel tidak ditemukan."
            );

        }


        /*
        Baca Excel sebagai array.
        */

        const rows =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: ""
                }
            );


        if (rows.length < 2) {

            throw new Error(
                "Data tanker tidak ditemukan di Excel."
            );

        }


        /*
        Ambil kolom Tanker Number.

        File kamu:
        Kolom A = nomor
        Kolom B = tanker number

        Jadi kita ambil row[1].
        */

        let daftarTanker =
            rows
                .slice(1)
                .map(
                    row =>
                        String(
                            row[1] || ""
                        ).trim()
                )
                .filter(
                    tanker =>
                        tanker !== ""
                );


        /*
        Hilangkan duplikat.
        */

        daftarTanker =
            [...new Set(
                daftarTanker
            )];


        /*
        Urutkan otomatis.
        */

        daftarTanker.sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        );


        /*
        PENTING:

        Excel sekarang menjadi
        sumber Master Tanker.

        Jadi kalau Excel berubah,
        website ikut berubah.
        */

        dataTanker =
            daftarTanker;


        /*
        Simpan versi terbaru
        ke localStorage.
        */

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                dataTanker
            )
        );


        /*
        Tampilkan data.
        */

        tampilkanData();


        tampilkanPesan(
            "Data Master Tanker berhasil diperbarui dari Excel.",
            "success"
        );


    } catch (error) {

        console.error(error);


        /*
        Kalau Excel gagal dibaca,
        tetap gunakan data lama
        yang ada di localStorage.
        */

        dataTanker =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                ) || "[]"
            );


        tampilkanData();


        tampilkanPesan(
            "Excel gagal dibaca: " +
            error.message +
            ". Data lama tetap digunakan.",
            "error"
        );

    }

}



/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData() {

    const table =
        document.getElementById(
            "tankerTable"
        );


    const total =
        document.getElementById(
            "totalTanker"
        );


    const search =
        document.getElementById(
            "searchTanker"
        );


    const kataCari =
        search
            ? search.value
                .trim()
                .toLowerCase()
            : "";


    const dataTampil =
        dataTanker.filter(
            tanker =>
                tanker
                    .toLowerCase()
                    .includes(
                        kataCari
                    )
        );


    /*
    Total seluruh Master Tanker.
    */

    total.textContent =
        dataTanker.length;


    table.innerHTML = "";


    if (
        dataTampil.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="3"
                    class="empty"
                >
                    Tidak ada tanker yang ditemukan.
                </td>

            </tr>

        `;

        return;

    }


    dataTampil.forEach(
        tanker => {

            const index =
                dataTanker.indexOf(
                    tanker
                );


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${tanker}
                </td>

                <td>

                    <div class="action">

                        <button
                            class="btn-edit"
                            onclick="editTanker(${index})"
                        >
                            Edit
                        </button>

                        <button
                            class="btn-delete"
                            onclick="hapusTanker(${index})"
                        >
                            Hapus
                        </button>

                    </div>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}



/* =====================================================
   TAMBAH TANKER
===================================================== */

function tambahTanker() {

    const input =
        document.getElementById(
            "inputTanker"
        );


    const nomor =
        input.value.trim();


    if (
        nomor === ""
    ) {

        tampilkanPesan(
            "Nomor tanker belum diisi.",
            "error"
        );

        return;

    }


    const sudahAda =
        dataTanker.some(
            tanker =>
                tanker
                    .toLowerCase()
                ===
                nomor
                    .toLowerCase()
        );


    if (
        sudahAda
    ) {

        tampilkanPesan(
            "Nomor tanker tersebut sudah ada.",
            "error"
        );

        return;

    }


    dataTanker.push(
        nomor
    );


    dataTanker.sort(
        (a, b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            dataTanker
        )
    );


    input.value = "";


    tampilkanData();


    tampilkanPesan(
        "Master tanker berhasil ditambahkan.",
        "success"
    );

}



/* =====================================================
   EDIT TANKER
===================================================== */

function editTanker(index) {

    const nomorLama =
        dataTanker[index];


    const nomorBaru =
        prompt(
            "Edit nomor tanker:",
            nomorLama
        );


    if (
        nomorBaru === null
    ) {

        return;

    }


    const nomor =
        nomorBaru.trim();


    if (
        nomor === ""
    ) {

        alert(
            "Nomor tanker tidak boleh kosong."
        );

        return;

    }


    const duplikat =
        dataTanker.some(
            (tanker, i) =>

                i !== index &&

                tanker
                    .toLowerCase()
                ===
                nomor
                    .toLowerCase()
        );


    if (
        duplikat
    ) {

        alert(
            "Nomor tanker tersebut sudah ada."
        );

        return;

    }


    dataTanker[index] =
        nomor;


    dataTanker.sort(
        (a, b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            dataTanker
        )
    );


    tampilkanData();


    tampilkanPesan(
        "Nomor tanker berhasil diedit.",
        "success"
    );

}



/* =====================================================
   HAPUS TANKER
===================================================== */

function hapusTanker(index) {

    const nomor =
        dataTanker[index];


    const yakin =
        confirm(
            "Yakin ingin menghapus tanker " +
            nomor +
            "?"
        );


    if (!yakin) {

        return;

    }


    dataTanker.splice(
        index,
        1
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            dataTanker
        )
    );


    tampilkanData();


    tampilkanPesan(
        "Master tanker berhasil dihapus.",
        "success"
    );

}



/* =====================================================
   PESAN
===================================================== */

function tampilkanPesan(
    pesan,
    tipe
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        pesan;


    message.className =
        "message " +
        tipe;

}

</script>


</body>

</html>
